<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Spotlight Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #222; color: #eee; }
    h2 { border-bottom: 1px solid #444; padding-bottom: 10px; }
    .section { margin-bottom: 30px; background: #333; padding: 20px; border-radius: 8px; }
    .form-group { margin-bottom: 15px; display: flex; align-items: center; }
    label { width: 120px; font-weight: bold; }
    input { padding: 8px; border-radius: 4px; border: 1px solid #555; background: #222; color: white; width: 100px; }
    button { padding: 10px 20px; background: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button:hover { background: #0b5ed7; }
    #status { margin-left: 10px; color: #4caf50; font-size: 14px; opacity: 0; transition: opacity 0.5s; }
    .note { font-size: 12px; color: #aaa; margin-top: 5px; }
    code { background: #444; padding: 2px 5px; border-radius: 3px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #444; }
    th { color: #aaa; font-weight: normal; }
    .btn-remove { background: #dc3545; padding: 4px 8px; font-size: 12px; }
    .btn-remove:hover { background: #bb2d3b; }
    .add-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-end; }
    .add-row div { display: flex; flex-direction: column; }
    .add-row input { width: 80px; }
    .add-row input.long { width: 220px; }
  </style>
</head>
<body>

  <h2 data-i18n="settingsTitle">Spotlight Settings</h2>

  <div class="section">
    <h3 data-i18n="secPrefixes">Search Prefixes</h3>
    <p class="note" data-i18n="notePrefixes"></p>
    
    <div class="form-group">
      <label for="prefix-tab" data-i18n="lblTabs">Tabs:</label>
      <input type="text" id="prefix-tab" placeholder="%t">
    </div>
    <div class="form-group">
      <label for="prefix-bookmark" data-i18n="lblBookmarks">Bookmarks:</label>
      <input type="text" id="prefix-bookmark" placeholder="%b">
    </div>
    <div class="form-group">
      <label for="prefix-history" data-i18n="lblHistory">History:</label>
      <input type="text" id="prefix-history" placeholder="%h">
    </div>
    <div class="form-group">
      <label for="prefix-search" data-i18n="lblWeb">Web Search:</label>
      <input type="text" id="prefix-search" placeholder="%s">
    </div>
    
    <button id="save" data-i18n="btnSave">Save Settings</button>
    <span id="status" data-i18n="msgSaved">Saved!</span>
  </div>

  <div class="section">
    <h3 data-i18n="secCustom">Custom Search Engines</h3>
    <p class="note"><span data-i18n="noteCustom1"></span></p>
    <p class="note"><span data-i18n="noteCustom2"></span></p>
    
    <div class="add-row">
      <div>
        <label style="width:auto; margin-bottom: 5px; font-size: 12px;" data-i18n="lblPrefix">Prefix</label>
        <input type="text" id="new-prefix" placeholder="@wiki">
      </div>
      <div>
        <label style="width:auto; margin-bottom: 5px; font-size: 12px;" data-i18n="lblName">Name</label>
        <input type="text" id="new-name" placeholder="Wikipedia">
      </div>
      <div>
        <label style="width:auto; margin-bottom: 5px; font-size: 12px;" data-i18n="lblUrl">URL</label>
        <input type="text" id="new-url" class="long" placeholder="https://.../search?q=%s">
      </div>
      <button id="add-engine" style="padding: 9px 15px;" data-i18n="btnAdd">Add</button>
    </div>

    <table id="engine-list">
      <thead>
        <tr>
          <th style="width: 20%;" data-i18n="thPrefix">Prefix</th>
          <th style="width: 20%;" data-i18n="thName">Name</th>
          <th data-i18n="thUrl">URL</th>
          <th style="width: 10%;" data-i18n="thAction">Action</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>

  <div class="section">
    <h3 data-i18n="secKeys">Key Bindings</h3>
    <p data-i18n="msgKeysDesc"></p>
    <ol>
      <li data-i18n="msgKeysStep1"></li>
      <li data-i18n="msgKeysStep2"></li>
      <li data-i18n="msgKeysStep3"></li>
      <li data-i18n="msgKeysStep4"></li>
    </ol>
  </div>

  <script src="options.js"></script>
</body>
</html>
